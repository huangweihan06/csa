<body>

<li><select id="langSel" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="id">Bahasa Indonesia</option></select></li>

<main>
<h1 data-i18n="j_h1">加入中国学生会</h1>
<p data-i18n="j_intro">填写表单报名,负责同学会尽快联系你。</p>
<form id="f" action="#" method="post" novalidate>
<label class="t" for="name" data-i18n="lb_name">姓名</label>
<input type="text" id="name" name="name" required minlength="2" placeholder="例如:王海洋" data-i18n-ph="ph_name">
<div class="err" id="e1"></div>
<label class="t" for="pw" data-i18n="lb_pw">设置密码(至少 8 位,含字母和数字)</label>
<input type="password" id="pw" name="pw" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}">
<div class="err" id="e2"></div>
<label class="t" for="msg" data-i18n="lb_msg">你想加入的原因</label>
<textarea id="msg" name="msg" rows="4" required minlength="10"></textarea>
<div class="err" id="e3"></div>
<label class="t" data-i18n="lb_grade">年级</label>
<span class="opt"><input type="radio" name="grade" value="1" required> <span data-i18n="y1">大一</span></span>
<span class="opt"><input type="radio" name="grade" value="2"> <span data-i18n="y2">大二</span></span>
<span class="opt"><input type="radio" name="grade" value="3"> <span data-i18n="y3">大三</span></span>
<span class="opt"><input type="radio" name="grade" value="4"> <span data-i18n="y4">大四</span></span>
<div class="err" id="e4"></div>
<label class="t" data-i18n="lb_need">感兴趣的活动(可多选)</label>
<span class="opt"><input type="checkbox" name="need" value="welcome"> <span data-i18n="k1">迎新联谊</span></span>
<span class="opt"><input type="checkbox" name="need" value="culture"> <span data-i18n="k2">文化节</span></span>
<span class="opt"><input type="checkbox" name="need" value="lang"> <span data-i18n="k3">语言互助</span></span>
<span class="opt"><input type="checkbox" name="need" value="sports"> <span data-i18n="k4">运动</span></span>
<div class="err" id="e5"></div>
<label class="t" for="dept" data-i18n="lb_dept">意向部门</label>
<select id="dept" name="dept" required>
<option value="" data-i18n="o_sel">请选择</option>
<option value="pub" data-i18n="dp1">宣传部</option>
<option value="evt" data-i18n="dp2">活动部</option>
<option value="out" data-i18n="dp3">外联部</option>
<option value="sup" data-i18n="dp4">生活服务部</option>
</select>
<div class="err" id="e6"></div>
<button type="submit" data-i18n="btn">提交报名</button>
<div id="result"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit",function(e){
e.preventDefault();
var ok=true;
function chk(id,cond,key){document.getElementById(id).textContent=cond?"":T(key);if(!cond)ok=false;}
chk("e1",this.name.value.trim().length>=2,"v1");
chk("e2",/^(?=.*[A-Za-z])(?=.*[0-9]).{8,}$/.test(this.pw.value),"v2");
chk("e3",this.msg.value.trim().length>=10,"v3");
chk("e4",!!this.querySelector("input[name=grade]:checked"),"v4");
chk("e5",this.querySelectorAll("input[name=need]:checked").length>0,"v5");
chk("e6",this.dept.value!=="","v6");
document.getElementById("result").textContent=ok?T("v_ok")+this.name.value.trim()+T("v_end"):"";
});
</script>
</main>
